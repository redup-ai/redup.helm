{{ regexReplaceAll ": '([0-9]+)'" (tpl (toYaml $.Values.statefulset.topologySpreadConstraints) $) ": ${1}" | indent 8 }}
{{- end }}
{{- if $.Values.statefulset.nodeSelector }}
