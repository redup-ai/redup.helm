{{ tpl (toYaml $.Values.statefulset.nodeSelector) $ | indent 8 }}
{{- end }}
{{- if $.Values.statefulset.tolerations }}
      tolerations:
{{ tpl (toYaml $.Values.statefulset.tolerations) $ | indent 8 }}
{{- end }}
{{- if $.Values.statefulset.imagePullSecrets }}
