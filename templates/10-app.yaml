{{- if and $.Values.service $.Values.service.enable }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
{{- if $.Values.service.serviceLabels }}
  labels:
    app: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
    app.kubernetes.io/name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
    app.kubernetes.io/component: {{ tpl ($.Values.global.package) $ }}
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
{{ tpl (toYaml $.Values.service.serviceLabels) $ | indent 4 }}
{{- end }}
{{- if $.Values.service.serviceAnnotations }}
  annotations:
{{ tpl (toYaml $.Values.service.serviceAnnotations) $ | indent 4 }}
{{- end }}
spec:
  selector:
    app: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
  type: ClusterIP
{{- if $.Values.service.clusterIP }}
  clusterIP: {{ tpl (toYaml $.Values.service.clusterIP) $ }}
{{- end }}
{{- if or $.Values.service.servicePorts (and $.Values.grpcGateway $.Values.grpcGateway.enable) }}
  ports:
{{- if $.Values.service.servicePorts }}
{{ tpl (toYaml $.Values.service.servicePorts) $ | indent 2 }}
{{- end }}
{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
  - port: {{ $.Values.grpcGateway.envoy.port }}
    name: {{ default "http-gateway" $.Values.grpcGateway.ingress.servicePort }}
    protocol: TCP
{{- end }}
{{- end }}
{{- end }}

{{- if and $.Values.deployment $.Values.deployment.enable }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
    app.kubernetes.io/name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
    app.kubernetes.io/component: {{ tpl ($.Values.global.package) $ }}
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
{{- if $.Values.deployment.annotations }}
  annotations:
{{ tpl (toYaml $.Values.deployment.annotations) $ | indent 8 }}
{{- end }}
spec:
{{- if or (not $.Values.hpa) (not $.Values.hpa.enable) }}
  replicas: {{ tpl ($.Values.deployment.replicas) $ }}
{{- end }}
  selector:
    matchLabels:
      app: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
{{- if $.Values.deployment.strategy }}
  strategy:
{{ tpl (toYaml $.Values.deployment.strategy) $ | indent 4 }}
{{- end }}
  template:
    metadata:
      labels:
        app: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
        version: {{ $.Chart.Version | replace "+" "_" }}
        app.kubernetes.io/name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}
        app.kubernetes.io/version: {{ $.Chart.Version | replace "+" "_" }}
        app.kubernetes.io/component: {{ tpl ($.Values.global.package) $ }}
        app.kubernetes.io/part-of: {{ $.Release.Namespace }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
{{- if $.Values.deployment.podLabels }}
{{ tpl (toYaml $.Values.deployment.podLabels) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.podAnnotations }}
      annotations:
{{ tpl (toYaml $.Values.deployment.podAnnotations) $ | indent 8 }}
{{- end }}
    spec:
{{- if $.Values.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $.Values.deployment.terminationGracePeriodSeconds }}
{{- end }}
{{- if $.Values.deployment.priorityClassName }}
      priorityClassName: {{ tpl (toYaml $.Values.deployment.priorityClassName) $ }}
{{- end }}
{{- if $.Values.deployment.podAffinity }}
      affinity:
{{ tpl (toYaml $.Values.deployment.podAffinity) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ regexReplaceAll ": '([0-9]+)'" (tpl (toYaml $.Values.deployment.topologySpreadConstraints) $) ": ${1}" | indent 8 }}
{{- end }}
{{- if $.Values.deployment.nodeSelector }}
      nodeSelector:
{{ tpl (toYaml $.Values.deployment.nodeSelector) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.tolerations }}
      tolerations:
{{ tpl (toYaml $.Values.deployment.tolerations) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.imagePullSecrets }}
      imagePullSecrets:
{{ tpl (toYaml $.Values.deployment.imagePullSecrets) $ | indent 8 }}
{{- end }}
{{- if or $.Values.deployment.volumes (and $.Values.grpcGateway $.Values.grpcGateway.enable) }}
      volumes:
{{- if $.Values.deployment.volumes }}
{{ tpl (toYaml $.Values.deployment.volumes) $ | indent 6 }}
{{- end }}
{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
      - name: grpc-gateway-artifacts
        emptyDir: {}
      - name: grpc-gateway-envoy-config
        configMap:
          name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}-grpc-gateway-envoy
{{- end }}
{{- end }}
{{- if or $.Values.deployment.initContainers (and $.Values.grpcGateway $.Values.grpcGateway.enable) }}
      initContainers:
{{- if $.Values.deployment.initContainers }}
{{ tpl (toYaml $.Values.deployment.initContainers) $ | indent 6 }}
{{- end }}
{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
      - name: grpc-gateway-init-copy
        image: {{ tpl ($.Values.global.registry) $ }}/{{ tpl ($.Values.grpcGateway.artifacts.podImage) $ }}
{{- if $.Values.grpcGateway.artifacts.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.grpcGateway.artifacts.imagePullPolicy }}
{{- end }}
        command:
        - /bin/sh
        - -ec
        args:
        - |
          cp {{ $.Values.grpcGateway.artifacts.gatewayPbPath }} /opt/grpc-gateway/artifacts/gateway.pb
          cp {{ $.Values.grpcGateway.artifacts.apiJsonPath }} /opt/grpc-gateway/artifacts/api.json
          # swagger-ui (Swagger 2.0) uses basePath for request URLs
          if grep -Eq '"basePath"[[:space:]]*:' /opt/grpc-gateway/artifacts/api.json; then
            sed -E 's/"basePath"[[:space:]]*:[[:space:]]*"[^"]*"/"basePath":"\/grpc-gateway"/' \
              /opt/grpc-gateway/artifacts/api.json > /opt/grpc-gateway/artifacts/api.json.tmp
          else
            # Insert basePath right after "swagger": "2.0",
            sed -E '0,/"swagger"[[:space:]]*:[[:space:]]*"2\.0"[[:space:]]*,/{s/"swagger"[[:space:]]*:[[:space:]]*"2\.0"[[:space:]]*,/"swagger":"2.0","basePath":"\/grpc-gateway",/}' \
              /opt/grpc-gateway/artifacts/api.json > /opt/grpc-gateway/artifacts/api.json.tmp
          fi
          mv /opt/grpc-gateway/artifacts/api.json.tmp /opt/grpc-gateway/artifacts/api.json
          chmod 0644 /opt/grpc-gateway/artifacts/api.json /opt/grpc-gateway/artifacts/gateway.pb

          # Keep servers[] for compatibility with some swagger-ui variants
          if grep -Eq '"servers"[[:space:]]*:' /opt/grpc-gateway/artifacts/api.json; then
            sed -E '0,/"servers"[[:space:]]*:[[:space:]]*\[[^]]*\]/{s//"servers":[{"url":"\/grpc-gateway"}]/}' \
              /opt/grpc-gateway/artifacts/api.json > /opt/grpc-gateway/artifacts/api.json.tmp
          else
            sed -E '0,/\{/{s//{"servers":[{"url":"\/grpc-gateway"}],/}' \
              /opt/grpc-gateway/artifacts/api.json > /opt/grpc-gateway/artifacts/api.json.tmp
          fi
          mv /opt/grpc-gateway/artifacts/api.json.tmp /opt/grpc-gateway/artifacts/api.json
        volumeMounts:
        - name: grpc-gateway-artifacts
          mountPath: /opt/grpc-gateway/artifacts
{{- end }}
{{- end }}
{{- if $.Values.deployment.kubeScheduler }}
      schedulerName: {{ $.Values.deployment.kubeScheduler }}
{{- end }}
      containers:
      - name: main
        image: {{ tpl ($.Values.global.registry) $ }}/{{ tpl ($.Values.deployment.podImage) $ }}
{{- if $.Values.deployment.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.deployment.imagePullPolicy }}
{{- end }}
{{- if $.Values.deployment.podCommand }}
{{ tpl (toYaml $.Values.deployment.podCommand) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.podArgs }}
{{ tpl (toYaml $.Values.deployment.podArgs) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.livenessProbe }}
        livenessProbe:
{{ tpl (toYaml $.Values.deployment.livenessProbe) $ | indent 10 }}
{{- end }}
{{- if $.Values.deployment.readinessProbe }}
        readinessProbe:
{{ tpl (toYaml $.Values.deployment.readinessProbe) $ | indent 10 }}
{{- end }}
{{- if $.Values.deployment.startupProbe }}
        startupProbe:
{{ tpl (toYaml $.Values.deployment.startupProbe) $ | indent 10 }}
{{- end }}
{{- if $.Values.deployment.resources }}
        resources:
{{ tpl (toYaml $.Values.deployment.resources) $ | indent 10 }}
{{- end }}
{{- if $.Values.deployment.containerPorts }}
        ports:
{{ tpl (toYaml $.Values.deployment.containerPorts) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.volumeMounts }}
        volumeMounts:
{{ tpl (toYaml $.Values.deployment.volumeMounts) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.envFrom }}
        envFrom:
{{ tpl (toYaml $.Values.deployment.envFrom) $ | indent 8 }}
{{- end }}
{{- if $.Values.deployment.env }}
        env:
{{ tpl (toYaml $.Values.deployment.env) $ | indent 8 }}
{{- end }}
{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
      - name: grpc-gateway-envoy
        image: {{ tpl ($.Values.global.registry) $ }}/{{ tpl ($.Values.grpcGateway.envoy.image) $ }}
{{- if $.Values.grpcGateway.envoy.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.grpcGateway.envoy.imagePullPolicy }}
{{- end }}
{{- if $.Values.grpcGateway.envoy.command }}
        command:
{{ tpl (toYaml $.Values.grpcGateway.envoy.command) $ | indent 8 }}
{{- end }}
{{- if $.Values.grpcGateway.envoy.args }}
        args:
{{ tpl (toYaml $.Values.grpcGateway.envoy.args) $ | indent 8 }}
{{- end }}
{{- if $.Values.grpcGateway.envoy.resources }}
        resources:
{{ tpl (toYaml $.Values.grpcGateway.envoy.resources) $ | indent 10 }}
{{- end }}
        ports:
        - containerPort: {{ $.Values.grpcGateway.envoy.port }}
          name: http-gateway
          protocol: TCP
        volumeMounts:
        - name: grpc-gateway-artifacts
          mountPath: /opt/grpc-gateway/artifacts
        - name: grpc-gateway-envoy-config
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
      - name: grpc-gateway-swagger
        image: {{ tpl ($.Values.global.registry) $ }}/{{ tpl ($.Values.grpcGateway.swagger.image) $ }}
{{- if $.Values.grpcGateway.swagger.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.grpcGateway.swagger.imagePullPolicy }}
{{- end }}
{{- if $.Values.grpcGateway.swagger.command }}
        command:
{{ tpl (toYaml $.Values.grpcGateway.swagger.command) $ | indent 8 }}
{{- end }}
{{- if $.Values.grpcGateway.swagger.args }}
        args:
{{ tpl (toYaml $.Values.grpcGateway.swagger.args) $ | indent 8 }}
{{- end }}
        env:
        - name: PORT
          value: "{{ $.Values.grpcGateway.swagger.port }}"
        - name: SWAGGER_JSON_URL
          value: "/api.swagger.json"
{{- if $.Values.grpcGateway.swagger.resources }}
        resources:
{{ tpl (toYaml $.Values.grpcGateway.swagger.resources) $ | indent 10 }}
{{- end }}
        ports:
        - containerPort: {{ $.Values.grpcGateway.swagger.port }}
          name: http-swagger
          protocol: TCP
        volumeMounts:
        - name: grpc-gateway-artifacts
          mountPath: /usr/share/nginx/html/api.swagger.json
          subPath: api.json
{{- end }}
{{- if $.Values.deployment.containers }}
{{ tpl (toYaml $.Values.deployment.containers) $ | indent 6 }}
{{- end }}
{{- end }}

