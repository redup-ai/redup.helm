{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}-grpc-gateway-envoy
data:
  envoy.yaml: |-
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 19001
    static_resources:
      clusters:
      - name: grpc
        connect_timeout: 1.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: grpc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ $.Values.grpcGateway.backend.grpcPort }}
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
      - name: swagger
        connect_timeout: 1.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: swagger
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ $.Values.grpcGateway.swagger.port }}
      listeners:
      - name: listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: {{ $.Values.grpcGateway.envoy.port }}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: AUTO
              stat_prefix: grpc_json
              route_config:
                name: local_route
                virtual_hosts:
                - name: app
                  domains: ["*"]
                  routes:
{{- range $_, $service := $.Values.grpcGateway.envoy.transcoderServices }}
                  - match:
                      prefix: /grpc-gateway/{{ $service }}
                    route:
                      cluster: grpc
                      prefix_rewrite: /{{ $service }}
                      timeout: 3600s
{{- end }}
                  - match:
                      path: /grpc-gateway
                    redirect:
                      path_redirect: /grpc-gateway/
                      response_code: MOVED_PERMANENTLY
                  - match:
                      prefix: /grpc-gateway
                    route:
                      cluster: swagger
                      prefix_rewrite: /
              http_filters:
              - name: envoy.filters.http.grpc_json_transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                  convert_grpc_status: true
                  ignore_unknown_query_parameters: true
                  proto_descriptor: /opt/grpc-gateway/artifacts/gateway.pb
                  services:
{{- range $_, $svc := $.Values.grpcGateway.envoy.transcoderServices }}
                  - {{ $svc }}
{{- end }}
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{- end }}
