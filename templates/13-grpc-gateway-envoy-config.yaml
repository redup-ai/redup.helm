{{- if and $.Values.grpcGateway $.Values.grpcGateway.enable }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace "." "-" }}-grpc-gateway-envoy
data:
  envoy.yaml: |-
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 19001
    static_resources:
      clusters:
      - name: grpc
        connect_timeout: 1.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: grpc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ $.Values.grpcGateway.backend.grpcPort }}
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
      - name: swagger
        connect_timeout: 1.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: swagger
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ $.Values.grpcGateway.swagger.port }}
      listeners:
      - name: listener
        per_connection_buffer_limit_bytes: 104857600
        address:
          socket_address:
            address: 0.0.0.0
            port_value: {{ $.Values.grpcGateway.envoy.port }}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: AUTO
              stat_prefix: grpc_json
              stream_idle_timeout: 0s
              route_config:
                name: local_route
                max_direct_response_body_size_bytes: 65536
                virtual_hosts:
                - name: gateway
                  domains: ["*"]
                  cors:
                    allow_credentials: true
                    allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,grpc-status-details-bin,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
                    allow_methods: GET, PUT, DELETE, POST
                    allow_origin_string_match:
                    - safe_regex:
                        google_re2: {}
                        regex: \*
                    expose_headers: grpc-status-details-bin,grpc-status,grpc-message,authorization
                    max_age: "1728000"
                  routes:
                  - match:
                      path: /
                    route:
                      cluster: swagger
                  - match:
                      path: /api.swagger.json
                    route:
                      cluster: swagger
                      prefix_rewrite: /api.swagger.json
                  - match:
                      path: /index.css
                    route:
                      cluster: swagger
                  - match:
                      prefix: /swagger-
                    route:
                      cluster: swagger
                  - match:
                      prefix: /favicon-
                    route:
                      cluster: swagger
                  - match:
                      prefix: /
                    route:
                      cluster: grpc
                      timeout: 3600s
              http_filters:
              - name: envoy.filters.http.grpc_json_transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                  convert_grpc_status: true
                  ignore_unknown_query_parameters: true
                  print_options:
                    add_whitespace: true
                    always_print_enums_as_ints: false
                    always_print_primitive_fields: true
                    preserve_proto_field_names: false
                  proto_descriptor: /opt/grpc-gateway/artifacts/gateway.pb
                  services:
{{- range $_, $svc := $.Values.grpcGateway.envoy.transcoderServices }}
                  - {{ $svc }}
{{- end }}
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{- end }}
