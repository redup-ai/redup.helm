{{- if and $.Values.hpa $.Values.hpa.enable }}
---
apiVersion: deckhouse.io/v1beta1
kind: PodMetric
metadata:
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 }}
spec:
  query: {{ tpl ($.Values.hpa.podMetric.query) $ }}
---
kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
{{- if $.Values.deployment.enable}}
    kind: Deployment
{{- else if $.Values.statefulset.enable}}
    kind: StatefulSet
{{- end}}
    name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 }}
  minReplicas: {{ tpl ($.Values.hpa.minReplicas) $ }}
  maxReplicas: {{ tpl ($.Values.hpa.maxReplicas) $ }}
{{- if $.Values.hpa.behavior }}
  behavior:
{{ tpl (toYaml $.Values.hpa.behavior) $ | indent 4 }}
{{- end }}
  metrics:
  - type: Pods
    pods:
      metric:
        name: {{ default $.Chart.Name $.Values.nameOverride | trunc 63 }}
      target:
        type: AverageValue
        averageValue: {{ tpl ($.Values.hpa.podMetric.averageValue) $ }}
{{- if $.Values.hpa.metrics }}
{{ tpl (toYaml $.Values.hpa.metrics) $ | indent 2 }}
{{- end }}
{{- end }}