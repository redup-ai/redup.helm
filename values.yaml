################################################################################
# HPA configuration for the application (Deckhouse only)                        #
################################################################################

hpa:
  # Enable HorizontalPodAutoscaler for the application
  enable: false
  # Minimum number of pod replicas
  minReplicas: "1"
  # Maximum number of pod replicas
  maxReplicas: "3"
  # Pod metrics configuration
  podMetric:
    query: round(100* (avg by(<<.GroupBy>>) (rate(your_metric{<<.LabelMatchers>>}[2m]))))
    averageValue: "80"
  # Scaling behavior configuration
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3600

################################################################################
# VPA configuration for the application                                         #
################################################################################

vpa:
  # Enable VerticalPodAutoscaler for the application
  enable: false
  # Method for updating resources fo pod. 
  # For k8s version 1.33 and above use InPlaceOrRecreate. For k8s version below 1.33 use Auto.
  updateMode: "InPlaceOrRecreate"
  # Minimum number of replicas before pods can be restarted with new RAM/CPU values
  minReplicas: "1"
  # Minimum allowed resources for pods
  minAllowed:
    memory: "128Mi"
    cpu: "100m"
  # Maximum allowed resources for pods
  maxAllowed:
    memory: "2Gi"
    cpu: "2"
  # Controlled resources and values
  controlledValues: "RequestsAndLimits"
  controlledResources: ["memory", "cpu"]
  recommenders: []
  # - name: redup
  extraContainers:
  - name: istio-proxy
    minAllowed:
      memory: "128Mi"
      cpu: "50m"
    maxAllowed:
      memory: "1Gi"
      cpu: "1"

################################################################################
# PersistentVolumeClaim configuration for the application                       #
################################################################################

persistentvolumeclaim:
  # Enable PersistentVolumeClaim for the application
  enable: false
  name: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}-{{ tpl (toYaml $.Values.persistentvolume) $ | sha256sum | trunc 8 }}"

################################################################################
# PersistentVolume configuration for the application                            #
################################################################################

persistentvolume:
  # Enable PersistentVolume for the application
  enable: false
  
################################################################################
# PodDisruptionBudget configuration for the application                         #
################################################################################

pdb:
  # Enable PodDisruptionBudget for the application
  enable: true
  # Maximum number of pods that can be unavailable in one moment
  maxUnavailable: "50%"

################################################################################
# ConfigMap configuration for the application                                   #
################################################################################

configMap:
  # Enable ConfigMap with configuration files for the application
  enable: true
  # Map of configuration files
  data: {}
    # config.yaml:
    #   service: {}
        
################################################################################
# Environment ConfigMap configuration for the application                       #
################################################################################

configEnv:
  # Enable ConfigMap with environment variables for the application
  enable: true
  # Map of environment variables
  data: {}
    # MY_ENV: "10"

################################################################################
# Extra Kubernetes manifests to deploy with the application                     #
################################################################################

extraDeploy:
  enable: false
  data: []
