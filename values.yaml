################################################################################
# Global application settings                                                   #
################################################################################

global:
  registry: REGISTRY_NAME
  package: REPO_NAME

################################################################################
# Application secrets configuration                                             #
################################################################################

secrets:
  enable: false
  data: {}

################################################################################
# Ingress controller configuration                                              #
################################################################################

ingress:
  # Enable external access to the application from outside the cluster (true/false)
  enable: false
  # IngressClass/controller name to use
  controller: "nginx"
  # Name of the secret that contains certificate for HTTPS/GRPCS traffic
  tls-secret-name: ""
  # Base domain where the application is exposed
  domain: "example.com"
  # Annotations for the ingress resource
  annotations: {}
  # Target service configuration for ingress traffic
  service:
    # Service port name
    port: "grpc-app"
  # List of hostnames that route traffic to the service
  hosts:
    # Example: <service-name>-<namespace-name>.example.com
  - "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}-{{ $.Release.Namespace }}.{{ $.Values.ingress.domain }}"
  extraIngresses: []
  # - hosts:
  #   - "metrics-{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}-{{ $.Release.Namespace }}.{{ $.Values.ingress.domain }}"
  #   service:
  #     port: "http-metrics"
  #     name: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
  #   annotations: {}
  #   tls-secret-name: ""
  #   controller: "nginx"
  #   name: "metrics-{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"

################################################################################
# Optional grpc gateway sidecars (envoy + swagger)                             #
################################################################################

grpcGateway:
  # Enables autogenerated init-copy + sidecar containers in Deployment
  enable: false
  artifacts:
    # Image that contains both gateway.pb and api.json
    podImage: IMAGE_NAME
    imagePullPolicy: IfNotPresent
    # Source files inside artifacts image
    gatewayPbPath: /artifacts/gateway.pb
    apiJsonPath: /artifacts/api.json
  envoy:
    image: envoyproxy/envoy:v1.34.4
    imagePullPolicy: IfNotPresent
    port: 18080
    transcoderServices:
    - change.me.v1.Service
    # Use for not transcoding, but for forwarding grpc requests.
    # If use many different protos, one main for transcoding 
    # and other for pure use grpc
    extraTranscoderServices: []
    resources:
      requests:
        cpu: 25m
        memory: "96Mi"
      limits:
        memory: "96Mi"
    # Optional command/args for custom envoy images
    command: []
    args: []
  backend:
    grpcPort: 9878
  ingress:
    # Service port for grpcGateway routes in the main ingress
    servicePort: "http-gateway"
    # Optional annotations for dedicated gateway ingress
    annotations: {}
  swagger:
    image: swaggerapi/swagger-ui:v5.27.0
    imagePullPolicy: IfNotPresent
    port: 18081
    resources:
      requests:
        cpu: 25m
        memory: "32Mi"
      limits:
        memory: "32Mi"
    # Optional command/args for custom swagger images
    command: []
    args: []

################################################################################
# Istio traffic configuration for the application                               #
################################################################################

istio:
  # Enable additional Istio-based networking configuration for the application
  enable: false
  # VirtualService configuration
  VirtualService:
  # List of hosts to which Istio rules apply
    hosts:
    # Example: <service>.<namespace>.svc.cluster.local
    - "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}.{{ $.Release.Namespace }}.svc.cluster.local"
    # HTTP routing rules for intercepted traffic
    http:
    # Rule name
    - name: default
    # Retry policy for failed requests
      retries:
      # Number of retry attempts
        attempts: 8
      # Conditions under which the request should be retried
        retryOn: connect-failure,refused-stream,unavailable,retriable-status-codes,resource-exhausted
      # Destination address for the routed traffic
      route:
      - destination:
          host: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}.{{ $.Release.Namespace }}.svc.cluster.local"
          # Destination subset (version of pods)
          subset: v1
      timeout: 3600s
  # DestinationRule configuration
  DestinationRule:
    # Rule for a specific host
    host: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}.{{ $.Release.Namespace }}.svc.cluster.local"
    # Subsets that select pods for traffic routing
    subsets:
    # Pod labels used to select pods in the cluster
    - labels:
        app: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
      # Subset name (version label)
      name: v1
    # Connection policy
    trafficPolicy:
      # Connection pool configuration
      connectionPool:
        http:
          # Idle connection timeout
          idleTimeout: 5s
        tcp:
          # Maximum time to establish a connection
          connectTimeout: 1s
          # Maximum lifetime of a connection (active connections are not closed)
          maxConnectionDuration: 60s
      # Load balancing strategy between service pods
      loadBalancer:
        simple: LEAST_REQUEST
  # PeerAuthentication configuration between sidecars
  PeerAuthentication:
    selector:
      matchLabels:
        app: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
    # TLS mode between Istio sidecars
    mtls:
      mode: DISABLE
  # Sidecar routing configuration
  Sidecar:
    workloadSelector:
      # Restricts pods to which this Sidecar applies
      labels:
        app: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
    egress:
    # Routing table; by default does not control any outgoing connections
    - hosts: ["~/*"]

################################################################################
# Service configuration for the application                                     #
################################################################################

service:
  # Enable Service resource for the application
  enable: true
  # Type of service. Also can be set to LoadBalancer (if appling in your cluster)
  type: ClusterIP
  # Additional service labels, e.g. for Deckhouse Prometheus scraping
  serviceLabels:
    prometheus.deckhouse.io/custom-target: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
  # List of pod ports exposed through the service
  servicePorts:
  # Service port
  - port: 9878
    # Port name in the pod
    name: grpc-app
    # Protocol for this port
    protocol: TCP
  - port: 9999
    name: http-metrics
    protocol: TCP

################################################################################
# Deployment configuration for the application                                  #
################################################################################

deployment:
  # Enable Deployment resource for the application
  enable: true
  annotations:
    pod-reloader.deckhouse.io/auto: "true"
  # Use annotations for application
  podAnnotations:
    sidecar.istio.io/proxyCPU: "100m"
    sidecar.istio.io/proxyCPULimit: "100m"
    sidecar.istio.io/proxyMemory: "128Mi"
    sidecar.istio.io/proxyMemoryLimit: "128Mi"
    sidecar.istio.io/statsHistogramBuckets: |
      {
        "istiocustom": [1, 5, 10, 20, 30, 50, 100, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 6000, 7000, 8000, 9000, 10000, 15000, 20000, 25000, 30000, 35000, 40000, 45000, 50000, 55000, 60000, 90000, 120000, 150000, 180000, 240000, 270000, 300000, 360000, 420000, 450000, 480000, 540000, 600000, 750000, 900000, 1050000, 1200000, 1350000, 1500000, 1800000, 2100000, 2400000, 2700000, 3000000, 3600000, 3750000, 4500000, 6000000, 7500000, 9000000, 10500000, 12000000, 13500000, 15000000, 17500000, 20000000, 25000000, 35000000, 50000000, 65000000, 80000000, 100000000, 120000000, 140000000, 160000000, 200000000, 260000000, 360000000, 500000000, 750000000, 1000000000, 2000000000]
      }
  # Number of replicas, ignoring HPA (recommended = minReplicas)
  replicas: "{{ tpl ($.Values.hpa.minReplicas) $ }}"
  # Priority for pod sheduling and descheduling
  priorityClassName: production-medium
  # Pod update strategy
  strategy:
    type: RollingUpdate
  # Container image for the main application container
  podImage: IMAGE_NAME
  # Resource requests/limits for the main container
  resources:
    # Resources required for stable application operation
    requests:
      memory: "{{ tpl ($.Values.vpa.maxAllowed.memory) $ }}"
      cpu: "{{ tpl ($.Values.vpa.maxAllowed.cpu) $ }}"
    # Maximum resources that can be consumed by the application
    limits:
      memory: "{{ tpl ($.Values.vpa.maxAllowed.memory) $ }}"
  # Liveness probe configuration
  livenessProbe:
    tcpSocket:
      port: 9878
    timeoutSeconds: 5
    initialDelaySeconds: 10
    periodSeconds: 30
  # Readiness probe configuration
  readinessProbe:
    tcpSocket:
      port: 9878
    timeoutSeconds: 5
    initialDelaySeconds: 10
    periodSeconds: 20
  # Startup probe to ensure the service has started
  startupProbe:
    tcpSocket:
      port: 9878
    failureThreshold: 90
    periodSeconds: 20
  # Maximum time for graceful shutdown after receiving SIGTERM
  terminationGracePeriodSeconds: 30
  # Pod NodeAffinity for clusters, use Static node preferable.
  podAffinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: node.deckhouse.io/type
            operator: In
            values:
            - Static
  # Pod topology spread constraints across the cluster
  topologySpreadConstraints:
  - maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
        app.kubernetes.io/component: "{{ tpl ($.Values.global.package) $ }}"
        app.kubernetes.io/part-of: "{{ $.Release.Namespace }}"
        app.kubernetes.io/instance: "{{ $.Release.Name }}"
    topologyKey: topology.kubernetes.io/zone
  - maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}"
        app.kubernetes.io/component: "{{ tpl ($.Values.global.package) $ }}"
        app.kubernetes.io/part-of: "{{ $.Release.Namespace }}"
        app.kubernetes.io/instance: "{{ $.Release.Name }}"
    topologyKey: kubernetes.io/hostname
  # Volumes attached to the pod
  volumes:
  - name: tz-config
    hostPath:
      path: /usr/share/zoneinfo/Europe/Moscow
  # Volume mounts for the main container
  volumeMounts:
  - name: tz-config
    mountPath: /etc/localtime
  # Environment configuration from ConfigMap
  envFrom:
  - configMapRef:
      name: "{{ default $.Chart.Name $.Values.nameOverride | trunc 63 | replace \".\" \"-\" }}-envs"
  # Ports exposed by the main container
  containerPorts:
    # Port where the application listens in the container
  - containerPort: 9878
    # Port name used by the Service
    name: grpc-app
    # Protocol for this port
    protocol: TCP
  # Port where application metrics are exposed
  - containerPort: 9999
  # Port name used by the Service for metrics
    name: http-app
  # Protocol for this port
    protocol: TCP

